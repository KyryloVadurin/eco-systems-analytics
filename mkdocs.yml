
theme:
  name: material
  language: uk
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Переключити на темну тему
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Переключити на світлу тему
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - header.autohide
    - search.suggest
    - search.highlight
    - content.code.copy

font:
  text: Roboto
  code: JetBrains Mono

markdown_extensions:
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: math
          class: arithmatex
          format: !!python/object/apply:pymdownx.arithmatex.arithmatex_fenced_format
            kwds:
              mode: generic
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list

hooks:
  - hooks/gfm_fixer.py

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

copyright: 'Copyright &copy; 2026 Kyrylo Vadurin &bull; <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank">CC BY-NC-SA 4.0</a>'

site_name: ІАТ в екологічних системах
site_description: Навчальний портал з дисципліни "Інформаційно-аналітичні технології в екологічних системах"

nav:
  - "Робоча програма": index.md
  
  - Лекції:
      - "Тема 1. Сучасні концепції цифровізації екологічного моніторингу": lk/lk1.md
      - "Тема 2. IoT-технології та сенсорні мережі в екології": lk/lk2.md
      - "Тема 3. Проектування екологічних баз даних": lk/lk3.md
      - "Тема 4. Статистичні методи аналізу складних екологічних даних": lk/lk4.md
      - "Тема 5. Багатовимірний аналіз та інтелектуальні технології": lk/lk5.md
      - "Тема 6. Комп’ютерне моделювання переносу та дифузії забруднюючих речовин": lk/lk6.md
      - "Тема 7. Геоінформаційні системи в екологічних дослідженнях": lk/lk7.md
      - "Тема 8. Моделювання динаміки та стійкості екологічних систем": lk/lk8.md
      - "Тема 9. Інформаційні системи прогнозування та оцінки екологічних ризиків": lk/lk9.md
      - "Тема 10. Квантово-гібридні та інтелектуальні платформи просторового прогнозування": lk/lk10.md

  - Лабораторні роботи:
      - "ЛБ 1. Дослідження функціональної архітектури та екологічного наповнення відкритих систем моніторингу довкілля": lb/lb1.md
      - "ЛБ 2. Конфігурування каналу передачі даних від IoT-станцій екологічного моніторингу на основі емульованих сенсорів та протоколу MQTT/LwM2M": lb/lb2.md
      - "ЛБ 3. Розробка реляційної структури екологічної бази даних для збереження показників забруднення атмосферного повітря": lb/lb3.md
      - "ЛБ 4. Статистична обробка часових рядів концентрацій екологічних забруднювачів": lb/lb4.md
      - "ЛБ 5. Класифікація та ранжування муніципальних об’єктів за рівнем екологічного навантаження методом головних компонент": lb/lb5.md
      - "ЛБ 6. Комп’ютерне моделювання процесів розсіювання викидів промислових підприємств у атмосферному повітрі на основі гаусової моделі": lb/lb6.md
      - "ЛБ 7. Геопросторова інтерполяція та картографування розподілу забруднюючих речовин у ГІС-середовищі": lb/lb7.md
      - "ЛБ 8. Моделювання стійкості популяції та оцінка критичних екологічних навантажень за моделлю Лотки-Вольтерра": lb/lb8.md
      - "ЛБ 9. Розробка аналітичної панелі для розрахунку та візуалізації індексу якості повітря в реальному часі": lb/lb9.md
      - "ЛБ 10. Застосування алгоритмів нечіткої логіки та квантово-гібридних шаблонів для оцінки екологічних ризиків і якості мікроклімату приміщень": lb/lb10.md

  - "Самостійна робота": sr/index.md
